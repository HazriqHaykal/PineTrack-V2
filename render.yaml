# Render Blueprint for the PineTrack FastAPI backend.
# Render -> New -> Blueprint -> pick this repo. Secrets marked "sync: false"
# are asked for once in the Render dashboard; they are never stored here.
services:
  - type: web
    name: pinetrack-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9  # pinned packages (pydantic 2.5, psycopg2 2.9.9) have no wheels for newer Python
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Supabase "Session pooler" connection string
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false  # your deployed frontend URL, e.g. https://your-app.vercel.app (no trailing slash)
